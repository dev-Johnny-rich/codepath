server:
  port: 8081

spring:
  application:
    name: codepath-business-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/codepath?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:codepath}
    password: ${DB_PASSWORD:codepath-dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:redis-dev}

codepath:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:internal-dev}
  jwt:
    secret: ${JWT_SECRET:codepath-dev-jwt-secret-change-before-production-2026}
    access-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@codepath.local}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7688}
    username: ${NEO4J_USERNAME:neo4j}
    password: ${NEO4J_PASSWORD:codepath-neo4j}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
  queues:
    execution: codepath:submission:queue
    diagnosis: codepath:diagnosis:queue
    execution-dlq: codepath:submission:dlq
    diagnosis-dlq: codepath:diagnosis:dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
